[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "intra-financial-ai"
version = "1.0.0"
description = "Auditable financial document intelligence workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.0,<3",
  "PyMuPDF>=1.23,<2",
  "pdfplumber>=0.11,<1",
  "typer>=0.12,<1",
  "jinja2>=3.1,<4"
]

[project.optional-dependencies]
agentic = ["langgraph>=0.2,<2", "openai>=1.50,<3"]
quality = ["pytest>=8,<10", "ruff>=0.7,<1", "mypy>=1.11,<2"]

[project.scripts]
intra-ai = "intra_financial_ai.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/intra_financial_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
